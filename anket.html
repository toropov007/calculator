:root{
  --paper:#E8EBE7;
  --card:#F6F8F5;
  --ink:#151A16;
  --ink-2:#333E38;
  --ink-3:#59665F;
  --line:#CDD5CE;
  --line-2:#DFE5E0;
  --accent:#0B6B57;
  --accent-soft:#D7E8E1;
  --accent-ink:#084A3C;
  --flag:#9A4B10;
  --flag-soft:#F5E4D6;
  --radius:10px;
  --maxw:760px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace}

/* ── шапка ── */
#rail{
  position:sticky;top:0;z-index:50;
  background:rgba(232,235,231,.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
#rail .inner{max-width:var(--maxw);margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;gap:14px}
#ticks{display:flex;gap:3px;flex:1}
.tick{height:3px;flex:1;background:var(--line);border-radius:2px;transition:background .25s}
.tick.done{background:var(--accent)}
.tick.now{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
#railmeta{font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap;letter-spacing:.02em}

/* ── каркас ── */
main{max-width:var(--maxw);margin:0 auto;padding:34px 20px 140px}
.screen{display:none;animation:in .22s ease-out}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}*{scroll-behavior:auto!important}}

.eyebrow{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
h1{font-size:30px;line-height:1.2;font-weight:700;margin:0 0 18px;letter-spacing:-.02em}
h2{font-size:23px;line-height:1.25;font-weight:600;margin:0 0 8px;letter-spacing:-.015em}
h3{font-size:16px;font-weight:600;margin:26px 0 10px}
p{margin:0 0 14px}
.lede{color:var(--ink-2);margin-bottom:26px;font-size:16.5px}
.hint{font-size:14px;color:var(--ink-2);margin:-4px 0 14px}
.note{font-size:13px;color:var(--ink-3)}
ul.plain{margin:0 0 20px;padding-left:20px;color:var(--ink-2)}
ul.plain li{margin-bottom:9px}

/* ── вопросы ── */
.q{margin:0 0 26px}
.q-label{font-weight:600;margin-bottom:4px;display:block}
.req{color:var(--flag);font-weight:700}
.q-hint{font-size:14.5px;color:var(--ink-2);margin-bottom:10px}
input[type=text],textarea{
  width:100%;font:inherit;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 13px;transition:border-color .15s,box-shadow .15s}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}

.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:8px 11px;border-radius:8px;
  cursor:pointer;transition:background .12s}
.opt:hover{background:var(--card)}
.opt input{margin:3px 0 0;accent-color:var(--accent);width:17px;height:17px;flex:none;cursor:pointer}
.opt span{flex:1}
.opt.checked{background:var(--accent-soft)}

.cat{margin-bottom:22px}
.cat-h{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink);
  padding-bottom:7px;margin-bottom:7px;border-bottom:1px solid var(--line)}

.other-row{display:flex;gap:8px;margin:6px 0 0 11px}
.other-row input{flex:1}
.addmore{background:none;border:none;color:var(--accent);font:inherit;font-size:14px;
  font-weight:600;cursor:pointer;padding:6px 11px;border-radius:8px}
.addmore:hover{background:var(--accent-soft)}

/* ── карточки задач (блок 3) ── */
.task{background:var(--card);border:1px solid var(--line-2);border-radius:var(--radius);
  padding:17px 18px;margin-bottom:14px;transition:border-color .18s,opacity .18s}
.task.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.task.filled{opacity:.62}
.task.filled:hover{opacity:1}
.task-name{font-weight:600;margin-bottom:12px;line-height:1.35}
.scale{margin-bottom:18px}
.scale:last-child{margin-bottom:0}
.scale-h{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:8px}
.chips{display:flex;flex-direction:column;gap:4px}
.chip{display:flex;align-items:center;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:7px;
  padding:9px 14px;font-size:14.5px;cursor:pointer;transition:all .12s;line-height:1.35}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.scale.dim{opacity:.4;pointer-events:none}
.na{font-size:13px;color:var(--ink-3);font-style:italic}

/* ── навигация ── */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(232,235,231,.95);backdrop-filter:blur(8px);
  border-top:1px solid var(--line)}
#nav .inner{max-width:var(--maxw);margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:12px}
button.btn{font:inherit;font-weight:600;border-radius:9px;cursor:pointer;
  padding:11px 22px;border:1px solid transparent;transition:all .14s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-3);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
#saveinfo{font-size:12px;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── тестовая панель ── */
#tp{position:fixed;left:14px;bottom:76px;z-index:80;width:250px;
  background:#1F2A24;color:#DCE6E0;border-radius:12px;
  box-shadow:0 8px 28px rgba(0,0,0,.28);font-size:12.5px;
  font-family:"JetBrains Mono",monospace;overflow:hidden;display:none}
#tp.on{display:block}
#tp .tp-h{display:flex;align-items:center;gap:8px;padding:9px 12px;
  background:#16201B;font-weight:700;letter-spacing:.08em;font-size:10.5px;
  text-transform:uppercase;color:#7FD8BC;cursor:pointer;user-select:none}
#tp .tp-h .x{margin-left:auto;color:#7C8A83;font-weight:400}
#tp .tp-b{padding:9px 10px 11px;max-height:56vh;overflow:auto}
#tp.min .tp-b{display:none}
#tp .grp{margin-bottom:9px}
#tp .grp-t{color:#7C8A83;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;margin:0 2px 5px}
#tp button{display:block;width:100%;text-align:left;font:inherit;font-size:12px;
  background:#2C3A32;color:#DCE6E0;border:none;border-radius:6px;
  padding:6px 9px;margin-bottom:3px;cursor:pointer;line-height:1.35}
#tp button:hover{background:#3A4C41}
#tp button.cur{background:#0B6B57;color:#fff}
#tp button.warn{background:#5A3418;color:#F0D9C4}
#tp button.warn:hover{background:#74441F}
#tp .flag{display:inline-block;padding:1px 6px;border-radius:4px;
  background:var(--flag);color:#fff;font-family:"JetBrains Mono",monospace;
  font-size:10px;font-weight:700;letter-spacing:.06em;margin-left:8px}

.thanks-img{display:block;width:260px;max-width:70%;height:auto;margin:26px 0 4px;
  image-rendering:auto}
.fail-img{display:block;width:100%;max-width:420px;height:auto;
  margin:24px 0 6px;border-radius:var(--radius);border:1px solid var(--line)}
@media (max-width:560px){.thanks-img{width:210px;margin-top:20px}}

#err{background:var(--flag-soft);border:1px solid #E3C4A8;color:#6E3608;
  border-radius:var(--radius);padding:11px 14px;margin-bottom:18px;font-size:14px;display:none}
#err.on{display:block}

@media (max-width:560px){
  main{padding:24px 15px 150px}
  h1{font-size:25px}h2{font-size:20px}
  #railmeta{font-size:11px}
}
</style>

/* ══════════════ СОСТОЯНИЕ ══════════════ */

const S = {
  name:"", projects:"",
  systems:[], systemsOther:[""],
  types:[], typesOther:[""],
  picked:{},          // "cat:item" → true
  other:{},           // catIdx → [строки]
  scales:{},          // taskId → {f:index, d:index}
  hard1:"", hard1why:"", hard2:[],
  problems:{},        // taskId → {list:[], other:[""]}
  a1:"",a2:"",a3:"",a4:"",a5:"",
  irritants:"", comment:"",
  started:new Date().toISOString()
};

const S_DEFAULT = JSON.parse(JSON.stringify(S));

const KEY = "anketa-oip-draft-v1";
let memStore = null;

function save(){
  const raw = JSON.stringify(S);
  try{ localStorage.setItem(KEY, raw); }catch(e){ memStore = raw; }
  const el = document.getElementById("saveinfo");
  el.textContent = "черновик сохранён";
  clearTimeout(save._t);
  save._t = setTimeout(()=>{ el.textContent=""; }, 2200);
}
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){ raw = memStore; }
  if(!raw) return false;
  try{ Object.assign(S, JSON.parse(raw)); return true; }catch(e){ return false; }
}
function wipe(){ try{ localStorage.removeItem(KEY); }catch(e){} memStore=null; }

/* ══════════════ ХЕЛПЕРЫ ══════════════ */

const el = (t,c,txt)=>{const n=document.createElement(t); if(c)n.className=c;
  if(txt!==undefined)n.textContent=txt; return n;};

function taskLabel(id){
  const [c,i] = id.split(":");
  const cat = CATEGORIES[+c];
  if(i[0]==="x"){ return (S.other[c]||[])[+i.slice(1)] || ""; }
  return cat.items[+i];
}
function taskFull(id){
  const cat = CATEGORIES[+id.split(":")[0]];
  return cat.name + " — " + taskLabel(id);
}
function pickedIds(){
  return Object.keys(S.picked).filter(k=>S.picked[k] && taskLabel(k));
}
function pickedInCat(c){
  return pickedIds().filter(id=>id.split(":")[0]===String(c));
}
function activeCats(){
  return CATEGORIES.map((_,i)=>i).filter(i=>pickedInCat(i).length>0);
}
function hardThree(){
  return [S.hard1].concat(S.hard2).filter(x=>x && pickedIds().includes(x));
}
function hoursPerYear(id){
  const s = S.scales[id]; if(!s || s.f==null) return null;
  if(FREQ[s.f].y === 0) return 0;
  if(s.d==null) return null;
  return FREQ[s.f].y * DUR[s.d].h;
}

/* ── конструкторы полей ── */

function textQ(label, key, opts={}){
  const q = el("div","q");
  const lb = el("label","q-label"); lb.textContent = label;
  if(opts.req){ const r=el("span","req"," *"); lb.appendChild(r); }
  q.appendChild(lb);
  if(opts.hint) q.appendChild(el("div","q-hint",opts.hint));
  const inp = opts.long ? el("textarea") : el("input");
  if(!opts.long) inp.type="text";
  inp.value = S[key] || "";
  if(opts.ph) inp.placeholder = opts.ph;
  inp.addEventListener("input", ()=>{ S[key]=inp.value; });
  inp.addEventListener("blur", save);
  q.appendChild(inp);
  return q;
}

function checkList(items, arr, onChange){
  const box = el("div","opts");
  items.forEach(txt=>{
    const lab = el("label","opt");
    const inp = el("input"); inp.type="checkbox";
    inp.checked = arr.includes(txt);
    if(inp.checked) lab.classList.add("checked");
    inp.addEventListener("change", ()=>{
      const i = arr.indexOf(txt);
      if(inp.checked && i<0) arr.push(txt);
      if(!inp.checked && i>=0) arr.splice(i,1);
      lab.classList.toggle("checked", inp.checked);
      if(onChange) onChange();
      save();
    });
    lab.appendChild(inp); lab.appendChild(el("span",null,txt));
    box.appendChild(lab);
  });
  return box;
}

function otherFields(arr, onChange){
  const wrap = el("div");

    wrap.innerHTML = "";

      const row = el("div","other-row");
      const inp = el("input"); inp.type="text"; inp.value=v;

}

      [...cF.children].forEach((c,i)=>c.classList.toggle("on", st.f===i));

      card.classList.toggle("filled", isDone(id));

    function setF(i){ st.f=i; if(FREQ[i].y===0) st.d=null; paint(); save(); maybeScroll(id); }
    function setD(i){ st.d=i; paint(); save(); maybeScroll(id); }

    card._paint = paint;
    paint();
    w.appendChild(card);
  });

  return w;

function isDone(id){
  const s = S.scales[id];
  if(!s || s.f===null) return false;
  if(FREQ[s.f].y===0) return true;
  return s.d!==null;
}
function refreshActive(){
  const cards = [...document.querySelectorAll(".screen.on .task")];
  let found = false;
  cards.forEach(c=>{
    const need = !isDone(c.dataset.id);
    const on = need && !found;
    c.classList.toggle("active", on);
    if(on) found = true;
  });
}
function maybeScroll(id){
  if(!isDone(id)) return;
  const cards = [...document.querySelectorAll(".screen.on .task")];
  const next = cards.find(c=>!isDone(c.dataset.id));
  if(!next) return;
  const y = next.getBoundingClientRect().top + window.pageYOffset - 68;
  window.scrollTo({top:y, behavior:"smooth"});
}

function payload(){
  const tasks = pickedIds().map(id=>{
    const s = S.scales[id] || {};
    return {
      category: CATEGORIES[+id.split(":")[0]].name,
      task: taskLabel(id),
      frequency: s.f!=null ? FREQ[s.f].l : null,
      duration:  s.d!=null ? DUR[s.d].l  : null,
      hoursPerYear: hoursPerYear(id)
    };
  });
  const probs = {};
  hardThree().forEach(id=>{
    const r = S.problems[id] || {list:[],other:[]};
    probs[taskFull(id)] = r.list.concat((r.other||[]).filter(x=>x.trim()));
  });
  return {
    respondent: S.name,
    projects: S.projects,
    systems: S.systems.concat(S.systemsOther.filter(x=>x.trim())),
    campaignTypes: S.types.concat(S.typesOther.filter(x=>x.trim())),
    tasks,
    hardest: S.hard1 ? taskFull(S.hard1) : null,
    hardestWhy: S.hard1why,
    alsoHard: S.hard2.map(taskFull),
    problems: probs,
    automation: {
      first: S.a1, vision: S.a2, timeSaved: S.a3,
      neverAutomate: S.a4, alreadyTried: S.a5
    },
    irritants: S.irritants,
    comment: S.comment,
    meta: { started: S.started, finished: new Date().toISOString() }
  };
}

function asText(){
  const p = payload();
  const L = [];
  L.push("АНКЕТА ОИП — " + (p.respondent || "без имени"));
  L.push("");
  L.push("Проекты: " + (p.projects || "—"));
  L.push("Системы: " + (p.systems.join(", ") || "—"));
  L.push("Типы кампаний: " + (p.campaignTypes.join(", ") || "—"));
  L.push("");
  L.push("── ЧАСТОТА И ВРЕМЯ ──");
  const sorted = p.tasks.slice().sort((a,b)=>(b.hoursPerYear||0)-(a.hoursPerYear||0));
  sorted.forEach(t=>{
    const h = t.hoursPerYear==null ? "—" : Math.round(t.hoursPerYear)+" ч/год";
    L.push("• " + t.task + " [" + t.category + "]");
    L.push("   " + (t.frequency||"—") + " × " + (t.duration||"—") + " = " + h);
  });
  L.push("");
  L.push("── ТЯЖЕЛЕЕ ВСЕГО ──");
  L.push("1) " + (p.hardest||"—"));
  L.push("   " + (p.hardestWhy||"—"));
  p.alsoHard.forEach((x,i)=>L.push((i+2)+") " + x));
  L.push("");
  L.push("── СЛОЖНОСТИ ──");
  Object.keys(p.problems).forEach(k=>{
    L.push("• " + k);
    (p.problems[k].length ? p.problems[k] : ["—"]).forEach(x=>L.push("   – " + x));
  });
  L.push("");
  L.push("── АВТОМАТИЗАЦИЯ ──");
  L.push("Первым: " + (p.automation.first||"—"));
  L.push("Как видит: " + (p.automation.vision||"—"));
  L.push("Экономия: " + (p.automation.timeSaved||"—"));
  L.push("Не доверил бы: " + (p.automation.neverAutomate||"—"));
  L.push("Уже пробовал: " + (p.automation.alreadyTried||"—"));
  L.push("");
  L.push("── РАЗДРАЖИТЕЛИ ──");
  L.push(p.irritants||"—");
  if(p.comment){ L.push(""); L.push("── КОММЕНТАРИЙ ──"); L.push(p.comment); }
  return L.join("\n");
}

function fileName(){
  const n = (S.name||"anketa").replace(/[^\wА-Яа-яЁё\- ]/g,"").trim().replace(/\s+/g,"_");
  return "anketa_" + (n||"bez_imeni") + ".json";

function downloadJSON(){
  const blob = new Blob([JSON.stringify(payload(),null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fileName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

let lastError = "";

function tgBase(){
  return "https://api.telegram.org/bot" + TELEGRAM_TOKEN;
}

async function tgCall(method, body){
  let r;
  try{
    r = await fetch(tgBase() + "/" + method, {method:"POST", body:body});
  }catch(e){
    throw new Error("нет связи с api.telegram.org — сеть недоступна, "
      + "либо адрес закрыт корпоративным прокси");
  }
  let j = null;
  try{ j = await r.json(); }catch(e){}
  if(!j) throw new Error("телеграм ответил непонятно (HTTP " + r.status + ")");
  if(!j.ok){
    const d = j.description || "без описания";
    if(/chat not found/i.test(d))
      throw new Error("chat_id не найден — проверь номер и напиши боту /start");
    if(/unauthorized/i.test(d))
      throw new Error("токен не принят — проверь, что он скопирован целиком");
    if(/blocked/i.test(d))
      throw new Error("бот заблокирован в этом чате");
    throw new Error("телеграм отклонил запрос: " + d);
  }
  return j;
}

async function send(){
  if(!TELEGRAM_TOKEN || TELEGRAM_TOKEN.indexOf("СЮДА")===0)
    throw new Error("в файле не заполнены токен и chat_id");

  const text = asText();
  const chunks = [];
  for(let i=0;i<text.length;i+=3800) chunks.push(text.slice(i,i+3800));

  for(const c of chunks){
    await tgCall("sendMessage", new URLSearchParams({
      chat_id: TELEGRAM_CHAT_ID,
      text: c,
      disable_web_page_preview: "true"
    }));
  }

  const fd = new FormData();
  fd.append("chat_id", TELEGRAM_CHAT_ID);
  fd.append("caption", "Данные: " + (S.name||"без имени"));
  fd.append("document", new Blob([JSON.stringify(payload(),null,2)],
    {type:"application/json"}), fileName());
  await tgCall("sendDocument", fd);
}

/* ══════════════ ТЕСТОВЫЙ РЕЖИМ ══════════════ */

let TEST = false;
let TEST_FAIL = false;

const SCREEN_TITLES = {
  intro:"Вступление", b1:"Блок 1 · проекты", b2:"Блок 2 · процессы",
  b4:"Блок 4 · тяжёлые", b5:"Блок 5 · автоматизация", b6:"Блок 6 · раздражители"
};
function screenTitle(sc){
  if(sc.id.indexOf("b3:")===0) return "Блок 3 · " + CATEGORIES[+sc.id.slice(3)].name;
  if(sc.id.indexOf("b4p:")===0){
    const id = hardThree()[+sc.id.slice(4)];
    return "Блок 4 · сложности: " + (id ? taskLabel(id) : "—");
  }
  return SCREEN_TITLES[sc.id] || sc.id;
}

function fillDemo(){
  S.name = "Тестова Тестина";
  S.projects = "Контур.Диадок, Контур.Экстерн, Контур.Толк";
  S.systems = ["Яндекс.Директ","ВК реклама"];
  S.systemsOther = ["Программатик через агентство",""];
  S.types = ["Лидогенерация","Медийная реклама","Продвижение вебинаров"];
  S.typesOther = [""];

  S.picked = {}; S.other = {}; S.scales = {}; S.problems = {};
  const plan = {0:[0], 1:[0,2,3,4], 2:[0,1], 3:[0,1], 4:[0,4,5], 5:[1,4], 6:[1,3], 7:[1]};
  Object.keys(plan).forEach(c=>plan[c].forEach(i=>{ S.picked[c+":"+i] = true; }));
  CATEGORIES.forEach((_,c)=>{ S.other[c] = [""]; });

  const ids = pickedIds();
  ids.forEach((id,n)=>{
    const f = [0,1,2,3,4,4,5,6,3,2,1,4,5,3,2,0][n % 16];
    const d = [2,1,3,4,6,5,4,6,2,3,1,5,4,2,3,1][n % 16];
    S.scales[id] = { f:f, d: FREQ[f].y===0 ? null : d };
  });

  const mp = ids.find(id=>taskLabel(id).indexOf("Создание МП")===0);
  S.hard1 = mp || ids[0];
  S.hard2 = ids.filter(id=>id!==S.hard1).slice(0,2);
  S.hard1why = "Данные приходится собирать из десятка источников и вручную сверять между собой. "
    + "Пока соберёшь фактуру, половина дня уходит, а сам расчёт занимает час.";
  hardThree().forEach((id,n)=>{
    S.problems[id] = { list: PROBLEMS.slice(n, n+4), other:[""] };
  });

  S.a1 = "Сбор фактуры для медиаплана";
  S.a2 = "На входе — ссылка на продукт и цель по бюджету. На выходе — заполненный черновик "
       + "МП по общему шаблону, который остаётся проверить и защитить.";
  S.a3 = "Процентов на 60, а по нервам — сильнее";
  S.a4 = "Финальную защиту перед заказчиком. Там нужно отвечать на вопросы, которых нет в данных.";
  S.a5 = "Пробовала собирать семантику через нейросети — экономит время, но всё равно всё проверяю руками.";
  S.irritants = "Внесение истории изменений и перенос задач из Толка в Планфикс. "
    + "Занимают пять минут, но выбивают из потока.";
  S.comment = "Тестовое заполнение.";
  save();
}

function resetAll(){
  wipe();
  Object.assign(S, JSON.parse(JSON.stringify(S_DEFAULT)));
  S.started = new Date().toISOString();
  cur = 0; finished = null;
}

function enableTest(){
  if(TEST) return;
  TEST = true;
  document.getElementById("tp").classList.add("on");
  render();
}

function drawPanel(){
  if(!TEST) return;
  const body = document.getElementById("tp-body");
  body.innerHTML = "";
  const list = screenList();

  const mk = (label, fn, cls)=>{
    const b = document.createElement("button");
    if(cls) b.className = cls;
    b.textContent = label;
    b.addEventListener("click", fn);
    return b;
  };
  const grp = (title)=>{
    const g = document.createElement("div"); g.className = "grp";
    const t = document.createElement("div"); t.className = "grp-t"; t.textContent = title;
    g.appendChild(t); body.appendChild(g); return g;
  };

  const g1 = grp("данные");
  g1.appendChild(mk("Заполнить демо-данными", ()=>{ fillDemo(); finished=null; render(); }));
  g1.appendChild(mk("Сбросить всё", ()=>{ resetAll(); render(); }, "warn"));

  const g2 = grp("экраны");
  list.forEach((sc,i)=>{
    g2.appendChild(mk(screenTitle(sc), ()=>{
      if(sc.id.indexOf("b3:")===0 && !pickedIds().length) fillDemo();
      if(sc.id.indexOf("b4p:")===0 && !hardThree().length) fillDemo();
      finished = null; cur = i; render();
    }, (!finished && i===cur) ? "cur" : ""));
  });

  const gd = grp("диагностика");
  const out = document.createElement("div");
  out.style.cssText = "font-size:11px;line-height:1.45;color:#9FB3A9;padding:4px 3px 0;white-space:pre-wrap";
  gd.appendChild(mk("Проверить связь с ботом", async ()=>{
    out.textContent = "проверяю…";
    const log = [];
    if(!TELEGRAM_TOKEN || TELEGRAM_TOKEN.indexOf("СЮДА")===0){
      out.textContent = "✕ токен и chat_id не заполнены в файле"; return;
    }
    try{
      const me = await tgCall("getMe", new URLSearchParams({}));
      log.push("✓ бот найден: @" + (me.result && me.result.username));
    }catch(e){ out.textContent = "✕ " + e.message; return; }
    try{
      await tgCall("sendMessage", new URLSearchParams({
        chat_id: TELEGRAM_CHAT_ID,
        text: "Проверка связи — анкета настроена верно."
      }));
      log.push("✓ сообщение отправлено, проверь чат");
    }catch(e){ log.push("✕ " + e.message); }
    out.textContent = log.join("\n");
  }));
  gd.appendChild(mk("Узнать chat_id", async ()=>{
    out.textContent = "спрашиваю телеграм…";
    let j;
    try{ j = await tgCall("getUpdates", new URLSearchParams({})); }
    catch(e){ out.textContent = "✕ " + e.message; return; }

    const found = [];
    (j.result||[]).forEach(u=>{
      const m = u.message || u.edited_message || u.channel_post || u.my_chat_member;
      const c = m && m.chat;
      if(!c) return;
      if(found.some(x=>x.id===c.id)) return;
      const who = c.title || [c.first_name,c.last_name].filter(Boolean).join(" ") || c.username || "";
      found.push({id:c.id, who:who, type:c.type});
    });

    if(!found.length){
      out.textContent = "телеграм не видит ни одного сообщения.\n"
        + "Открой чат с ботом, нажми «Запустить» или отправь /start,\n"
        + "потом нажми эту кнопку ещё раз.";
      return;
    }
    const cur = String(TELEGRAM_CHAT_ID);
    const lines = found.map(f=>{
      const mark = String(f.id)===cur ? "  ← сейчас в файле" : "";
      return f.id + "   " + (f.who||f.type) + mark;
    });
    const hit = found.some(f=>String(f.id)===cur);
    lines.push("");
    lines.push(hit ? "В файле указан один из этих чатов."
                   : "Ни один не совпадает с тем, что в файле (" + cur + ").\n"
                     + "Впиши нужное число в строку 18 вместо текущего.");
    out.textContent = lines.join("\n");
  }));
  gd.appendChild(out);

  const g3 = grp("финальный экран");
  g3.appendChild(mk("Экран «отправлено»", ()=>{ finished="ok"; render(); },
    finished==="ok" ? "cur" : ""));
  g3.appendChild(mk("Экран «не отправилось»", ()=>{ finished="fail"; render(); },
    finished==="fail" ? "cur" : ""));
  g3.appendChild(mk(TEST_FAIL ? "Отправка: эмулирую сбой" : "Отправка: не отправлять, показать успех",
    ()=>{ TEST_FAIL = !TEST_FAIL; drawPanel(); }));
}

document.getElementById("tp-toggle").addEventListener("click", ()=>{
  const tp = document.getElementById("tp");
  tp.classList.toggle("min");
  tp.querySelector(".x").textContent = tp.classList.contains("min") ? "+" : "–";
});

/* включение: #test в адресе или просто набрать «test» на клавиатуре */
if(String(location.hash||"").toLowerCase().indexOf("test")>=0) setTimeout(enableTest,0);
window.addEventListener("hashchange", ()=>{
  if(String(location.hash||"").toLowerCase().indexOf("test")>=0) enableTest();
});
let _buf = "";
document.addEventListener("keydown", e=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea") return;
  if(!e.key || e.key.length!==1) return;
  _buf = (_buf + e.key.toLowerCase()).slice(-6);
  if(_buf.indexOf("test")>=0 || _buf.indexOf("тест")>=0) enableTest();
});

/* ══════════════ НАВИГАЦИЯ ══════════════ */

let cur = 0;
let finished = null;

function screenList(){
  const list = [
    {id:"intro", make:scIntro, check:()=>null},
    {id:"b1",    make:scBlock1, check:()=>{
      if(!S.name.trim()) return "Укажи фамилию и имя.";
      if(!S.projects.trim()) return "Напиши, какие проекты ведёшь.";
      return null; }},
    {id:"b2",    make:scBlock2, check:()=>
      pickedIds().length ? null : "Отметь хотя бы один процесс — дальше мы будем работать с этим списком." }
  ];
  activeCats().forEach(ci=>{
    list.push({id:"b3:"+ci, make:()=>scScales(ci), check:()=>{
      const miss = pickedInCat(ci).filter(id=>!isDone(id));
      if(miss.length) return "Осталось оценить: " + miss.map(taskLabel).join(", ") + ".";
      return null; }});
  });
  list.push({id:"b4", make:scHard, check:()=>{
    const ok = pickedIds();
    if(!S.hard1 || !ok.includes(S.hard1)) return "Отметь процесс, который даётся тяжелее всего.";
    if(!S.hard1why.trim()) return "Опиши, в чём его главная сложность.";
    S.hard2 = S.hard2.filter(x=>ok.includes(x) && x!==S.hard1);
    if(S.hard2.length!==2) return "Выбери ровно два процесса во втором вопросе.";
    return null; }});
  if(S.hard1 && S.hard2.length===2){
    hardThree().forEach((id,n)=>{
      list.push({id:"b4p:"+n, make:()=>scProblems(n), check:()=>null});
    });
  }
  list.push({id:"b5", make:scAuto, check:()=>{
    if(!S.a1.trim()) return "Напиши, какой процесс автоматизировал(а) бы первым.";
    if(!S.a2.trim()) return "Опиши, как ты видишь эту автоматизацию.";
    if(!S.a3.trim()) return "Напиши, насколько это сократило бы время.";
    if(!S.a4.trim()) return "Ответь, что не доверил(а) бы автоматизации.";
    return null; }});
  list.push({id:"b6", make:scLast, check:()=>
    S.irritants.trim() ? null : "Ответь на вопрос про задачи-раздражители — или напиши, что таких нет." });
  return list;
}

function render(){
  const list = screenList();
  if(cur >= list.length) cur = list.length-1;
  const main = document.getElementById("main");
  main.innerHTML = "";

  const errBox = el("div","","");
  errBox.id = "err";
  main.appendChild(errBox);

  const wrap = el("div","screen on");
  if(finished){ wrap.appendChild(scDone(finished)); }
  else { wrap.appendChild(list[cur].make()); }
  main.appendChild(wrap);

  const ticks = document.getElementById("ticks");
  ticks.innerHTML = "";
  list.forEach((_,i)=>{
    const t = el("div","tick" + (finished || i<cur ? " done" : (i===cur ? " now" : "")));
    ticks.appendChild(t);
  });
  const meta = document.getElementById("railmeta");
  const known = list[cur].id.indexOf("b3:")===0 || ["b4","b5","b6"].indexOf(list[cur].id)>=0
    || list[cur].id.indexOf("b4p:")===0;
  meta.textContent = finished ? "готово"
    : ("шаг " + (cur+1) + " / " + list.length + (known ? " · ~" + estMin(list) + " мин" : ""));

  const nav = document.getElementById("nav");
  const back = document.getElementById("back");
  const next = document.getElementById("next");
  nav.style.display = finished ? "none" : "";
  back.style.display = cur===0 ? "none" : "";
  next.textContent = cur===0 ? "Начать"
    : (cur===list.length-1 ? "Отправить ответы" : "Далее");

  if(TEST){
    const f = document.createElement("span");
    f.className = "flag"; f.textContent = "ТЕСТ";
    document.getElementById("railmeta").appendChild(f);
    drawPanel();
  }

  refreshActive();
  window.scrollTo({top:0, behavior:"auto"});
}

function estMin(list){
  const left = list.length - cur - 1;
  const scales = list.slice(cur).filter(s=>s.id.startsWith("b3:")).length;
  return Math.max(1, Math.round(left*1.2 + scales*1.1));
}

function showErr(msg){
  const b = document.getElementById("err");
  b.textContent = msg; b.classList.add("on");
  b.scrollIntoView({behavior:"smooth", block:"center"});
}

document.getElementById("next").addEventListener("click", async ()=>{
  const list = screenList();
  const err = list[cur].check();
  if(err){ showErr(err); return; }
  save();
  if(cur === list.length-1){
    const btn = document.getElementById("next");
    btn.disabled = true; btn.textContent = "Отправляю…";
    if(TEST){
      await new Promise(r=>setTimeout(r,400));
      finished = TEST_FAIL ? "fail" : "ok";
    } else {
      try{ await send(); finished = "ok"; lastError = ""; wipe(); }
      catch(e){ finished = "fail"; lastError = e.message || String(e); }
    }
    btn.disabled = false;
    render();
    return;
  }
  cur++;
  if(cur===1 || cur===Math.floor(list.length/2)) { /* место для микрокопии */ }
  render();
});

document.getElementById("draft").addEventListener("click", ()=>{
  save();
  const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "chernovik_ankety.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
});

document.getElementById("back").addEventListener("click", ()=>{
  if(cur>0){ cur--; render(); }
});

/* старт */
if(load()){
  const has = S.name || pickedIds().length;
  if(has){
    const list = screenList();
    let i = 0;
    while(i < list.length-1 && !list[i].check()) i++;
    cur = i;
  }
}
render();
</script>
